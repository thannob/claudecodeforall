<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ส่วนประกอบเมนู | แนะนำอาหารไทย</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kanit:ital,wght@0,200;0,300;0,400;0,500;0,700;1,300&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="site-nav">
  <div class="nav-inner">
    <a class="nav-logo" href="index.html">แนะนำอาหารไทย</a>
    <a class="pill-outline" href="index.html">← กลับไปหน้ารวมเมนู</a>
  </div>
</header>

<main>
  <section class="section" id="detail-section">
    <div id="detail-card"></div>
    <p class="no-results" id="detail-not-found">ไม่พบเมนูที่คุณค้นหา ลองกลับไปเลือกเมนูใหม่จากหน้ารวมเมนูนะ 🙏</p>
  </section>
</main>

<footer class="site-footer">
  <p>ทำที่บ้านหรือหาชิมที่ร้านโปรดใกล้บ้านคุณ แล้วมาลิ้มลอง <strong>รสชาติไทยแท้</strong> กันวันนี้ 🇹🇭</p>
</footer>

<script src="menu-data.js"></script>
<script>
(function () {
  var params = new URLSearchParams(window.location.search);
  var dishName = params.get('dish');
  var dish = window.menuData.find(function (d) {
    return d.name === dishName;
  });

  var cardEl = document.getElementById('detail-card');
  var notFoundEl = document.getElementById('detail-not-found');

  if (!dish) {
    document.title = 'ไม่พบเมนูนี้ | ส่วนประกอบเมนู';
    cardEl.style.display = 'none';
    notFoundEl.classList.add('show');
    return;
  }

  document.title = dish.name + ' | ส่วนประกอบเมนู';

  var mediaHtml = dish.image
    ? '<img class="dish-photo" src="' + dish.image + '" alt="' + dish.name + '" loading="lazy">'
    : '<span class="emoji-tile">' + dish.emoji + '</span>';

  var ingredientsHtml = dish.ingredients.map(function (item) {
    return '<li>' + item + '</li>';
  }).join('');

  cardEl.innerHTML =
    '<div class="detail-hero">' + mediaHtml + '</div>' +
    '<p class="eyebrow detail-tag">' + dish.tag + '</p>' +
    '<h1 class="detail-title">' + dish.name + '</h1>' +
    '<p class="detail-description">' + dish.description + '</p>' +
    '<h2 class="ingredients-title">ส่วนประกอบ</h2>' +
    '<ul class="ingredients-list">' + ingredientsHtml + '</ul>';
})();
</script>

</body>
</html>
